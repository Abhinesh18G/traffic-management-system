
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-management
  labels:
    app: traffic-management
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: traffic-management
  template:
    metadata:
      labels:
        app: traffic-management
    spec:
      containers:
        - name: traffic-dashboard
          image: abhinesh18g/traffic-management-system:v1
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health.html
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health.html
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-management-service
spec:
  type: NodePort
  selector:
    app: traffic-management
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30088
